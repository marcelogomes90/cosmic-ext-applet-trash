[package]
name = "cosmic-ext-applet-trash"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Reach the trash from the COSMIC panel"
repository = "https://github.com/marcelogomes90/cosmic-ext-applet-trash"
homepage = "https://github.com/marcelogomes90/cosmic-ext-applet-trash"
readme = "README.md"

[lib]
name = "cosmic_ext_applet_trash"
path = "src/lib.rs"

[[bin]]
name = "cosmic-ext-applet-trash"
path = "src/main.rs"

[[bin]]
name = "cosmic-ext-applet-trash-dump"
path = "src/bin/trash_dump.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
futures = "0.3"
i18n-embed-fl = "0.10"
notify = "8"
rust-embed = "8"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = { version = "5.2.6", default-features = false }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]


[profile.release]
lto = "thin"
opt-level = 2
